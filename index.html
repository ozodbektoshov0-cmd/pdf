<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Muharrir</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#eef0f4;--pn:#fff;--tx:#1b1f2a;--bd:#d5d9e2;--ac:#2563eb;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--pn:#1e232c;--tx:#e8eaf0;--bd:#343b48;--ac:#5b8cff;--ac2:#0b1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--pn:#1e232c;--tx:#e8eaf0;--bd:#343b48;--ac:#5b8cff;--ac2:#0b1020;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pn);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--pn);border-bottom:1px solid var(--bd);padding:8px;display:flex;flex-wrap:wrap;gap:6px 14px}
.g{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.on,.pr{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
input[type=color]{padding:0;width:34px;height:30px}input[type=number]{width:64px}
main{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:14px}
#wrap{flex:1 1 520px;max-width:794px;min-width:0}
#cv{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 14px #0004;touch-action:none}
#pp{flex:0 1 330px;min-width:250px;overflow-x:auto}
#pp textarea{width:100%;height:130px}
.gr{display:grid;gap:3px;margin-bottom:8px}.gr input{width:100%;min-width:0;padding:4px}
.h{opacity:.75;line-height:1.5;margin:0}
#ms{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;max-width:90%;z-index:20}
</style></head><body>
<header>
<div class="g" id="tools"></div>
<div class="g"><input type="color" id="col" value="#111111"><label>Oʻlcham <input type="number" id="sz" value="22" min="1" max="300"></label>
<select id="fn"><option>Arial<option>Times New Roman<option>Courier New<option>Georgia</select><label><input type="checkbox" id="bd"> Qalin</label></div>
<div class="g" id="ac"></div>
<div class="g"><label><input type="checkbox" id="as" checked> Avto-skaner</label></div>
<div class="g" id="pg"></div><div class="g" id="pa"></div>
</header>
<main><div id="wrap"><canvas id="cv" width="794" height="1123"></canvas></div><aside id="pp"></aside></main>
<div id="ms"></div>
<input type="file" id="fm" accept="image/*" multiple hidden><input type="file" id="fi" accept="image/*" hidden>
<script>
const W=794,H=1123,$=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
let pages=[{bg:null,o:[]}],cur=0,tool='sel',sel=null,drag=null;
const P=()=>pages[cur],mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const B=(l,f)=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;return b};
const msg=t=>{$('#ms').textContent=t;$('#ms').style.opacity=t?1:0};$('#ms').onclick=()=>msg('');
const noBg=()=>(msg('Avval sahifaga rasm yuklang'),0);
/* formulalar */
function calc(s){let i=0;const ws=()=>{while(s[i]==' ')i++};
const num=()=>{ws();if(s[i]=='('){i++;const v=add();ws();i++;return v}if(s[i]=='-'){i++;return -num()}const m=/^\d*\.?\d+(e[+-]?\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return +m[0]};
const mul=()=>{let v=num();for(;;){ws();const c=s[i];if(c=='*'){i++;v*=num()}else if(c=='/'){i++;v/=num()}else return v}};
const add=()=>{let v=mul();for(;;){ws();const c=s[i];if(c=='+'){i++;v+=mul()}else if(c=='-'){i++;v-=mul()}else return v}};
const r=add();ws();if(i<s.length)throw 0;return r}
function val(o,r,c,d){if(d>15)return NaN;let v=(o.d[r]||[])[c];if(v==null||v==='')return 0;v=String(v).trim();if(v[0]!='='){const n=parseFloat(v.replace(',','.'));return isNaN(n)?0:n}return ev(o,v.slice(1).toUpperCase(),d+1)}
function ev(o,e,d){e=e.replace(/(SUM|AVG|MIN|MAX|COUNT)\(([A-Z])(\d+):([A-Z])(\d+)\)/g,(m,f,a,b,c,r2)=>{const vs=[];for(let i=b-1;i<+r2;i++)for(let j=a.charCodeAt(0)-65;j<=c.charCodeAt(0)-65;j++)vs.push(val(o,i,j,d));const s=vs.reduce((x,y)=>x+y,0);return '('+({SUM:s,AVG:s/vs.length,MIN:Math.min(...vs),MAX:Math.max(...vs),COUNT:vs.length}[f])+')'});
e=e.replace(/([A-Z])(\d+)/g,(m,a,b)=>'('+val(o,b-1,a.charCodeAt(0)-65,d)+')');try{return calc(e)}catch(x){return NaN}}
function cell(o,r,c){const v=String(o.d[r][c]??'');if(v[0]!='=')return v;const n=val(o,r,c,0);return isNaN(n)?'#XATO':String(Math.round(n*1e4)/1e4)}
/* oʻlchamlar va chizish */
const fnt=o=>(o.b?'bold ':'')+o.s+'px '+(o.f||'Arial');
function bb(o){if(o.t=='text'){cx.font=fnt(o);const L=o.v.split('\n');return [o.x,o.y,Math.max(10,...L.map(l=>cx.measureText(l).width)),L.length*o.s*1.25]}
if(o.t=='tbl')return [o.x,o.y,o.cw*o.d[0].length,o.rh*o.d.length];
if(o.t=='pen'){const xs=o.p.map(p=>p[0]),ys=o.p.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);return [x,y,Math.max(...xs)-x,Math.max(...ys)-y]}
return [o.x,o.y,o.w,o.h]}
function render(c,pg,k,ui){c.save();c.scale(k,k);c.fillStyle='#fff';c.fillRect(0,0,W,H);
if(pg.bg){const b=pg.bg.cv,s=Math.min(W/b.width,H/b.height),w=b.width*s,h=b.height*s;c.drawImage(b,(W-w)/2,(H-h)/2,w,h)}
pg.o.forEach(o=>{c.fillStyle=c.strokeStyle=o.c||'#000';
if(o.t=='rect')c.fillRect(o.x,o.y,o.w,o.h);
else if(o.t=='img')c.drawImage(o.im,o.x,o.y,o.w,o.h);
else if(o.t=='pen'){c.lineWidth=o.s;c.lineCap=c.lineJoin='round';c.beginPath();o.p.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(o.p.length==1)c.lineTo(o.p[0][0]+.1,o.p[0][1]);c.stroke()}
else if(o.t=='text'){c.font=fnt(o);c.textBaseline='top';o.v.split('\n').forEach((l,i)=>c.fillText(l,o.x,o.y+i*o.s*1.25))}
else if(o.t=='tbl'){c.font=fnt(o);c.textBaseline='middle';c.lineWidth=1;o.d.forEach((row,r)=>row.forEach((_,q)=>{const x=o.x+q*o.cw,y=o.y+r*o.rh;c.strokeRect(x,y,o.cw,o.rh);c.save();c.beginPath();c.rect(x,y,o.cw,o.rh);c.clip();c.fillText(cell(o,r,q),x+5,y+o.rh/2);c.restore()}))}});
if(ui&&sel){const [x,y,w,h]=bb(sel);c.strokeStyle='#2563eb';c.setLineDash([5,4]);c.lineWidth=1.5;c.strokeRect(x-3,y-3,w+6,h+6);c.setLineDash([]);if(sel.t=='rect'||sel.t=='img'){c.fillStyle='#2563eb';c.fillRect(x+w-6,y+h-6,12,12)}}
c.restore()}
const draw=()=>render(cx,P(),1,true);
/* tanlash va panel */
function pick(o){sel=o;if(o){if(o.c)$('#col').value=o.c;if(o.s)$('#sz').value=o.s;if(o.f)$('#fn').value=o.f;if(o.t=='text')$('#bd').checked=!!o.b}panel();draw()}
const add=o=>{P().o.push(o);pick(o)};
function panel(){const p=$('#pp'),o=sel;p.innerHTML='';
if(!o){p.innerHTML='<p class="h">Asbobni tanlab sahifaga bosing yoki bosib torting. Obyektni tanlab matn, rang, oʻlchamini tahrirlang.<br><br>Jadvalda formula: =SUM(A1:A3), =B2*C2, =AVG(A1:A4), =MAX(B1:B5)</p>';return}
if(o.t=='text'){const t=document.createElement('textarea');t.id='tv';t.value=o.v;t.oninput=()=>{o.v=t.value;draw()};p.append(t)}
else if(o.t=='tbl'){const g=document.createElement('div');g.className='gr';g.style.gridTemplateColumns='repeat('+o.d[0].length+',minmax(64px,1fr))';
o.d.forEach((r,i)=>r.forEach((v,j)=>{const n=document.createElement('input');n.value=v;n.placeholder=String.fromCharCode(65+j)+(i+1);n.oninput=()=>{r[j]=n.value;draw()};g.append(n)}));p.append(g);
[['+ qator',()=>o.d.push(o.d[0].map(()=>''))],['− qator',()=>o.d.length>1&&o.d.pop()],['+ ustun',()=>o.d.forEach(r=>r.push(''))],['− ustun',()=>o.d[0].length>1&&o.d.forEach(r=>r.pop())]].forEach(([l,f])=>p.append(B(l,()=>{f();panel();draw()})));
const w=document.createElement('input');w.type='number';w.value=o.cw;w.oninput=()=>{o.cw=+w.value||60;draw()};p.append(document.createElement('br'),'Ustun eni: ',w)}
else if(o.t=='img'||o.t=='rect')p.innerHTML='<p class="h">Pastki oʻng burchakdagi kvadratni tortib oʻlchamini oʻzgartiring. Rangni yuqoridan tanlang.</p>'}
$('#col').oninput=e=>{if(sel&&sel.t!='img'){sel.c=e.target.value;draw()}};
$('#sz').oninput=e=>{if(sel&&sel.s){sel.s=+e.target.value||10;if(sel.t=='tbl')sel.rh=Math.max(sel.rh,sel.s*1.8);draw()}};
$('#fn').onchange=e=>{if(sel&&sel.f){sel.f=e.target.value;draw()}};
$('#bd').onchange=e=>{if(sel&&sel.t=='text'){sel.b=e.target.checked;draw()}};
/* sichqoncha / sensor */
const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const hit=(o,x,y)=>{const [a,b,w,h]=bb(o),m=o.t=='pen'?o.s/2+6:0;return x>=a-m&&x<=a+w+m&&y>=b-m&&y<=b+h+m};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const [x,y]=pt(e),pg=P(),c=$('#col').value,s=+$('#sz').value||20;
if(tool=='sel'){if(sel&&(sel.t=='rect'||sel.t=='img')){const [a,b,w,h]=bb(sel);if(Math.abs(x-a-w)<12&&Math.abs(y-b-h)<12){drag={m:'rs',x,y};return}}
const o=[...pg.o].reverse().find(o=>hit(o,x,y))||null;drag=o?{m:'mv',x,y}:null;pick(o);return}
if(tool=='text'){add({t:'text',x,y,s,c,v:'Matn',f:$('#fn').value,b:$('#bd').checked});setTool('sel');setTimeout(()=>$('#tv')&&$('#tv').select(),0);return}
if(tool=='tbl'){add({t:'tbl',x,y,s:16,c,f:$('#fn').value,cw:110,rh:30,d:[['','',''],['','',''],['','',''],['','','']]});setTool('sel');return}
pick(null);const o=tool=='pen'?{t:'pen',p:[[x,y]],c,s}:{t:'rect',x,y,w:0,h:0,c:tool=='erase'?'#ffffff':c};pg.o.push(o);drag={m:tool=='pen'?'pen':'rc',o};draw()};
cv.onpointermove=e=>{if(!drag)return;const [x,y]=pt(e),d=drag;
if(d.m=='pen')d.o.p.push([x,y]);
else if(d.m=='rc'){d.o.w=x-d.o.x;d.o.h=y-d.o.y}
else if(d.m=='mv'){const dx=x-d.x,dy=y-d.y;d.x=x;d.y=y;if(sel.t=='pen')sel.p.forEach(p=>{p[0]+=dx;p[1]+=dy});else{sel.x+=dx;sel.y+=dy}}
else{if(sel.t=='img'){const r=sel.h/sel.w;sel.w=Math.max(20,sel.w+x-d.x);sel.h=sel.w*r}else{sel.w=Math.max(10,sel.w+x-d.x);sel.h=Math.max(10,sel.h+y-d.y)}d.x=x;d.y=y}
draw()};
cv.onpointerup=()=>{const d=drag;drag=null;if(d&&d.m=='rc'){const o=d.o;if(o.w<0){o.x+=o.w;o.w=-o.w}if(o.h<0){o.y+=o.h;o.h=-o.h}if(o.w<3||o.h<3)P().o.pop()}draw()};
/* asboblar */
function setTool(k){tool=k;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));cv.style.cursor=k=='sel'?'default':'crosshair'}
[['sel','Tanlash'],['text','Matn'],['tbl','Jadval'],['pen','Qalam'],['rect','Toʻrtburchak'],['erase','Oʻchirgʻich (oq)']].forEach(([k,l])=>{const b=B(l,()=>setTool(k));b.dataset.k=k;$('#tools').append(b)});
const del=()=>{if(!sel)return;P().o=P().o.filter(o=>o!==sel);pick(null)};
const undo=()=>{P().o.pop();pick(null)};
document.onkeydown=e=>{if(e.key=='Delete'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))del()};
/* rasm: yuklash, skaner, burish, OCR */
const load=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,2000/Math.max(im.width,im.height)),c=mk(Math.round(im.width*k),Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c)};im.onerror=no;im.src=r.result};r.readAsDataURL(f)});
function flt(a,w,h,r,mx){const t=new Float32Array(a.length),o=new Float32Array(a.length);for(let p=0;p<2;p++){const s=p?t:a,d=p?o:t,n1=p?h:w,n2=p?w:h,s1=p?w*4:4,s2=p?4:w*4;for(let j=0;j<n2;j++)for(let i=0;i<n1;i++)for(let k=0;k<3;k++){let v=0,c=0;for(let u=Math.max(0,i-r);u<=Math.min(n1-1,i+r);u++){const z=s[j*s2+u*s1+k];if(mx){if(z>v)v=z}else{v+=z;c++}}d[j*s2+i*s1+k]=mx?v:v/c}}return o}
function scan(src){const w0=src.width,h0=src.height,k=Math.max(1,Math.round(Math.max(w0,h0)/160)),w=Math.ceil(w0/k),h=Math.ceil(h0/k),s=mk(w,h),sx=s.getContext('2d');sx.drawImage(src,0,0,w,h);const id=sx.getImageData(0,0,w,h);
let a=flt(flt(flt(Float32Array.from(id.data),w,h,4,1),w,h,4,0),w,h,4,0);for(let i=0;i<a.length;i++)id.data[i]=i%4==3?255:a[i];sx.putImageData(id,0,0);
const big=mk(w0,h0),bx=big.getContext('2d');bx.drawImage(s,0,0,w0,h0);const g=bx.getImageData(0,0,w0,h0),o=src.getContext('2d').getImageData(0,0,w0,h0);
for(let i=0;i<o.data.length;i+=4)for(let c=0;c<3;c++){const v=Math.min(1,o.data[i+c]/Math.max(g.data[i+c],20)*1.05);o.data[i+c]=255*Math.pow(v,1.8)}
const out=mk(w0,h0);out.getContext('2d').putImageData(o,0,0);return out}
function rot(c,d){const q=Math.abs(d)==90,n=q?mk(c.height,c.width):mk(c.width,c.height),x=n.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,n.width,n.height);x.translate(n.width/2,n.height/2);x.rotate(d*Math.PI/180);x.drawImage(c,-c.width/2,-c.height/2);return n}
const rb=d=>{const b=P().bg;if(!b)return noBg();b.cv=rot(b.cv,d);draw()};
const sc=()=>{const b=P().bg;if(!b)return noBg();msg('Tozalanmoqda…');setTimeout(()=>{b.cv=scan(b.cv);draw();msg('')},40)};
async function ocr(){const pg=P(),b=pg.bg;if(!b)return noBg();if(!window.Tesseract)return msg('OCR kutubxonasi yuklanmadi (internet kerak).');
try{msg('OCR: tayyorlanmoqda…');const wk=await Tesseract.createWorker('uzb+eng',1,{logger:m=>m.progress!=null&&msg('OCR: '+Math.round(m.progress*100)+'%')});
const {data}=await wk.recognize(b.cv);await wk.terminate();
const s=Math.min(W/b.cv.width,H/b.cv.height),ox=(W-b.cv.width*s)/2,oy=(H-b.cv.height*s)/2;let n=0;
(data.lines||[]).forEach(l=>{const t=l.text.trim();if(!t)return;const {x0,y0,x1,y1}=l.bbox,x=ox+x0*s,y=oy+y0*s,w=(x1-x0)*s,h=(y1-y0)*s;
pg.o.push({t:'rect',x:x-2,y:y-2,w:w+4,h:h+4,c:'#ffffff'},{t:'text',x,y:y+h*.1,s:Math.max(8,Math.round(h*.78)),c:'#000000',v:t,f:'Arial'});n++});
pick(null);msg(n?n+' qator aniqlandi. Matnni tanlab tahrirlang; matnni oʻchirsangiz, oq qoplama qoladi.':'Matn topilmadi.')}
catch(e){msg('OCR ishlamadi: u internet bilan, oʻz hostingingizda ochilganda ishlaydi.')}}
$('#fm').onchange=async e=>{for(const f of e.target.files){msg('Yuklanmoqda…');await new Promise(r=>setTimeout(r,20));let c=await load(f);if($('#as').checked)c=scan(c);
if(P().bg||P().o.length){pages.splice(cur+1,0,{bg:{cv:c},o:[]});cur++}else P().bg={cv:c}}e.target.value='';msg('');go(cur)};
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;const c=await load(f),w=Math.min(400,c.width);add({t:'img',im:c,x:60,y:60,w,h:w*c.height/c.width});e.target.value=''};
[['Rasmlardan sahifalar',()=>$('#fm').click()],['Rasm qoʻshish',()=>$('#fi').click()],['Skaner',sc],['OCR',ocr],['⟲',()=>rb(-90)],['⟳',()=>rb(90)],['−1°',()=>rb(-1)],['+1°',()=>rb(1)],['Ortga',undo],['Oʻchirish',del]].forEach(([l,f])=>$('#ac').append(B(l,f)));
/* sahifalar va PDF */
function bar(){const g=$('#pg');g.innerHTML='';pages.forEach((_,i)=>{const b=B(i+1,()=>go(i));if(i==cur)b.className='on';g.append(b)})}
const go=i=>{cur=i;pick(null);bar()};
const mv=d=>{const j=cur+d;if(j<0||j>=pages.length)return;[pages[cur],pages[j]]=[pages[j],pages[cur]];go(j)};
[['+ Sahifa',()=>{pages.splice(cur+1,0,{bg:null,o:[]});go(cur+1)}],['Sahifani oʻchirish',()=>{if(pages.length>1){pages.splice(cur,1);go(Math.min(cur,pages.length-1))}}],['◀',()=>mv(-1)],['▶',()=>mv(1)]].forEach(([l,f])=>$('#pa').append(B(l,f)));
const pb=B('PDF saqlash',pdf);pb.className='pr';$('#pa').append(pb);
async function pdf(){msg('PDF tayyorlanmoqda…');await new Promise(r=>setTimeout(r,40));
try{const d=new jspdf.jsPDF({unit:'pt',format:'a4'}),pw=d.internal.pageSize.getWidth(),ph=d.internal.pageSize.getHeight();
pages.forEach((pg,i)=>{const c=mk(W*2,H*2);render(c.getContext('2d'),pg,2,false);if(i)d.addPage();d.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,ph)});
const blob=d.output('blob'),dl=window.claude?await claude.use('downloads'):null;
if(dl){try{await dl.save({filename:'hujjat.pdf',data:blob});msg('')}catch(e){msg(e.code=='declined'?'':'Saqlab boʻlmadi: '+(e.message||e.code))}}
else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hujjat.pdf';a.click();msg('')}}
catch(e){msg('PDF yaratib boʻlmadi (jsPDF yuklanmagan boʻlishi mumkin).')}}
setTool('sel');go(0);
</script></body></html>
